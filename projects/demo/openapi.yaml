openapi: 3.0.3
info:
  title: JSONPlaceholder API
  description: Fake online REST API for testing and prototyping.
  version: 1.0.0
servers:
  - url: https://jsonplaceholder.typicode.com
paths:
  /demo.pdf:
    get:
      operationId: downloadDemoPdf
      summary: Download the local demo PDF
      servers:
        - url: /
      responses:
        '200':
          description: A deterministic PDF served by the demo application.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /todos:
    get:
      operationId: listTodos
      summary: List all todos
      parameters:
        - name: _limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      operationId: createTodo
      summary: Create a new todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTodo'
      responses:
        '201':
          description: The created todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/{id}:
    get:
      operationId: getTodo
      summary: Get a single todo by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
    put:
      operationId: updateTodo
      summary: Update a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTodo'
      responses:
        '200':
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Todo deleted
components:
  schemas:
    Todo:
      type: object
      required:
        - userId
        - id
        - title
        - completed
      properties:
        userId:
          type: integer
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
    NewTodo:
      type: object
      required:
        - title
        - userId
      properties:
        title:
          type: string
        completed:
          type: boolean
        userId:
          type: integer
